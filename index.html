<!DOCTYPE html>  <html lang="sw">    <head>    
  <meta charset="UTF-8" />    
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />    
  <title>Wussabook</title>    
  <style>    
    :root {    
      /* Instagram Light Theme */    
      --bg: #fafafa;    
      --card: #ffffff;    
      --text: #262626;    
      --text-secondary: #8e8e8e;    
      --border: #dbdbdb;    
      --primary: #0095f6;    
      --primary-hover: #1877f2;    
      --heart: #ed4956;    
      --gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);    
      --shadow: 0 1px 2px rgba(0,0,0,0.05);    
    }  [data-theme="dark"] {    
  --bg: #000000;    
  --card: #121212;    
  --text: #f5f5f5;    
  --text-secondary: #a8a8a8;    
  --border: #262626;    
  --primary: #0095f6;    
  --shadow: 0 1px 3px rgba(0,0,0,0.4);    
}    - {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

body {
background: var(--bg);
color: var(--text);
min-height: 100vh;
transition: background 0.3s, color 0.3s;
}

/* ========== HEADER ========== */
header {
background: var(--card);
border-bottom: 1px solid var(--border);
position: sticky;
top: 0;
z-index: 100;
padding: 10px 16px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.logo {
font-size: 26px;
font-weight: 700;
background: var(--gradient);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
cursor: pointer;
letter-spacing: -0.5px;
}

.header-right {
display: flex;
align-items: center;
gap: 14px;
}

.icon-btn {
background: none;
border: none;
font-size: 22px;
cursor: pointer;
color: var(--text);
position: relative;
}

.profile-btn {
width: 32px;
height: 32px;
border-radius: 50%;
background: var(--gradient);
display: flex;
align-items: center;
justify-content: center;
color: white;
font-weight: 700;
font-size: 14px;
border: none;
cursor: pointer;
position: relative;
}

.blue-tick {
display: inline-flex;
align-items: center;
justify-content: center;
width: 15px;
height: 15px;
background: var(--primary);
color: white;
border-radius: 50%;
font-size: 9px;
font-weight: bold;
margin-left: 3px;
vertical-align: middle;
}

/* ========== NAV ========== */
nav {
display: flex;
background: var(--card);
border-bottom: 1px solid var(--border);
position: sticky;
top: 53px;
z-index: 90;
overflow-x: auto;
scrollbar-width: none;
}

nav::-webkit-scrollbar { display: none; }

nav button {
flex: 1;
min-width: 70px;
padding: 12px 8px;
border: none;
background: transparent;
color: var(--text-secondary);
font-size: 13px;
font-weight: 600;
cursor: pointer;
position: relative;
white-space: nowrap;
}

nav button.active {
color: var(--text);
}

nav button.active::after {
content: "";
position: absolute;
bottom: 0;
left: 20%;
right: 20%;
height: 2px;
background: var(--text);
}

/* ========== CONTAINER ========== */
.container {
max-width: 470px;
margin: 0 auto;
padding-bottom: 30px;
}

/* ========== STORIES / REELS ========== */
.stories {
background: var(--card);
border-bottom: 1px solid var(--border);
padding: 14px 12px;
display: flex;
gap: 14px;
overflow-x: auto;
scrollbar-width: none;
}

.stories::-webkit-scrollbar { display: none; }

.story {
flex: 0 0 auto;
width: 74px;
text-align: center;
cursor: pointer;
}

.story-ring {
width: 66px;
height: 66px;
border-radius: 50%;
padding: 3px;
background: var(--gradient);
margin: 0 auto 6px;
}

.story-ring.seen {
background: var(--border);
}

.story-avatar {
width: 100%;
height: 100%;
border-radius: 50%;
background: var(--card);
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 20px;
border: 2px solid var(--card);
overflow: hidden;
}

.story-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}

.story-name {
font-size: 12px;
color: var(--text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

/* ========== CREATE POST ========== */
.create-post {
background: var(--card);
border-bottom: 1px solid var(--border);
padding: 12px 16px;
display: flex;
align-items: center;
gap: 12px;
}

.create-post input {
flex: 1;
border: 1px solid var(--border);
background: var(--bg);
border-radius: 20px;
padding: 10px 16px;
font-size: 14px;
outline: none;
color: var(--text);
cursor: pointer;
}

/* ========== POST ========== */
.post {
background: var(--card);
border-bottom: 1px solid var(--border);
margin-bottom: 8px;
}

.post-header {
display: flex;
align-items: center;
padding: 12px 14px;
gap: 10px;
}

.post-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background: var(--gradient);
display: flex;
align-items: center;
justify-content: center;
color: white;
font-weight: 700;
font-size: 15px;
}

.post-user {
flex: 1;
}

.post-user .name {
font-weight: 600;
font-size: 14px;
display: flex;
align-items: center;
}

.post-user .time {
font-size: 12px;
color: var(--text-secondary);
}

.more-btn {
background: none;
border: none;
font-size: 18px;
color: var(--text);
cursor: pointer;
}

.post-media {
width: 100%;
max-height: 580px;
object-fit: cover;
display: block;
background: #000;
}

.post-actions {
display: flex;
align-items: center;
padding: 10px 14px 6px;
gap: 16px;
}

.post-actions button {
background: none;
border: none;
font-size: 24px;
cursor: pointer;
color: var(--text);
padding: 0;
}

.post-actions .liked {
color: var(--heart);
}

.post-likes {
padding: 0 14px 6px;
font-weight: 600;
font-size: 14px;
}

.post-caption {
padding: 0 14px 8px;
font-size: 14px;
line-height: 1.4;
}

.post-caption .username {
font-weight: 600;
margin-right: 6px;
}

.post-comments {
padding: 0 14px 12px;
font-size: 14px;
color: var(--text-secondary);
cursor: pointer;
}

/* ========== MODALS ========== */
.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.65);
z-index: 200;
align-items: flex-end;
justify-content: center;
}

.modal.show {
display: flex;
}

.modal-content {
background: var(--card);
width: 100%;
max-width: 470px;
border-radius: 16px 16px 0 0;
padding: 20px;
max-height: 90vh;
overflow-y: auto;
animation: slideUp 0.3s ease;
}

@keyframes slideUp {
from { transform: translateY(100%); }
to { transform: translateY(0); }
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
}

.modal-header h2 {
font-size: 18px;
font-weight: 700;
}

.close-btn {
background: none;
border: none;
font-size: 24px;
cursor: pointer;
color: var(--text);
}

/* Account Modal */
.account-info {
text-align: center;
padding: 10px 0 20px;
}

.big-avatar {
width: 86px;
height: 86px;
border-radius: 50%;
background: var(--gradient);
margin: 0 auto 12px;
display: flex;
align-items: center;
justify-content: center;
color: white;
font-size: 34px;
font-weight: 700;
}

.account-info h3 {
font-size: 20px;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}

.verified-badge {
display: inline-block;
background: rgba(0,149,246,0.12);
color: var(--primary);
padding: 5px 12px;
border-radius: 20px;
font-size: 13px;
font-weight: 600;
margin-top: 8px;
}

.menu-list {
list-style: none;
}

.menu-list li {
padding: 14px 0;
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
gap: 12px;
cursor: pointer;
font-size: 15px;
font-weight: 500;
}

.menu-list li:last-child {
border-bottom: none;
color: #ed4956;
}

/* Create Post Modal */
.create-modal textarea {
width: 100%;
min-height: 110px;
border: none;
outline: none;
font-size: 16px;
resize: none;
background: transparent;
color: var(--text);
margin: 12px 0;
}

.media-preview {
margin: 10px 0;
border-radius: 10px;
overflow: hidden;
display: none;
}

.media-preview img,
.media-preview video {
width: 100%;
max-height: 260px;
object-fit: cover;
}

.create-actions-row {
display: flex;
gap: 10px;
margin-bottom: 16px;
}

.create-actions-row button {
flex: 1;
padding: 10px;
border: 1px solid var(--border);
border-radius: 8px;
background: var(--bg);
color: var(--text);
font-size: 14px;
font-weight: 600;
cursor: pointer;
}

.submit-post {
width: 100%;
background: var(--primary);
color: white;
border: none;
padding: 13px;
border-radius: 10px;
font-size: 15px;
font-weight: 700;
cursor: pointer;
}

.submit-post:disabled {
opacity: 0.5;
cursor: not-allowed;
}

/* Dark mode toggle */
.theme-toggle {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 0;
border-bottom: 1px solid var(--border);
font-weight: 500;
}

.switch {
position: relative;
width: 46px;
height: 26px;
}

.switch input {
opacity: 0;
width: 0;
height: 0;
}

.slider {
position: absolute;
cursor: pointer;
inset: 0;
background: #ccc;
border-radius: 26px;
transition: 0.3s;
}

.slider:before {
position: absolute;
content: "";
height: 20px;
width: 20px;
left: 3px;
bottom: 3px;
background: white;
border-radius: 50%;
transition: 0.3s;
}

input:checked + .slider {
background: var(--primary);
}

input:checked + .slider:before {
transform: translateX(20px);
}

/* Empty state */
.empty {
text-align: center;
padding: 40px 20px;
color: var(--text-secondary);
}

  </style>    
</head>    
<body>    <!-- HEADER -->    <header>    
    <div class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">Wussabook</div>    
    <div class="header-right">    
      <button class="icon-btn" onclick="openCreatePost()" title="New Post">➕</button>    
      <button class="icon-btn" title="Messages">💬</button>    
      <button class="icon-btn" title="Notifications">❤️</button>    
      <button class="profile-btn" onclick="openAccountMenu()">W</button>    
    </div>    
  </header>    <!-- NAV -->    <nav>    
    <button class="active" onclick="setActive(this)">🏠 Home</button>    
    <button onclick="setActive(this)">🎬 Reels</button>    
    <button onclick="setActive(this)">📹 Videos</button>    
    <button onclick="setActive(this)">👥 Friends</button>    
    <button onclick="setActive(this)">🛒 Shop</button>    
  </nav>    <div class="container">  <!-- STORIES -->    
<div class="stories" id="stories">    
  <!-- Generated by JS -->    
</div>    <!-- CREATE POST BAR -->    <div class="create-post">    
  <div class="post-avatar">W</div>    
  <input type="text" placeholder="Unawaza nini?" readonly onclick="openCreatePost()" />    
</div>    <!-- FEED -->    <div id="feed"></div>    </div>    <!-- ACCOUNT MODAL -->    <div class="modal" id="accountModal">    
    <div class="modal-content">    
      <div class="modal-header">    
        <h2>Akaunti Yako</h2>    
        <button class="close-btn" onclick="closeModal('accountModal')">✕</button>    
      </div>  <div class="account-info">    
    <div class="big-avatar">W</div>    
    <h3>Wewe <span class="blue-tick">✓</span></h3>    
    <div class="verified-badge">✓ Verified • Blue Tick ya Kudumu</div>    
    <p style="color:var(--text-secondary);margin-top:6px;font-size:14px;">@wussa</p>    
  </div>      <div class="theme-toggle">    
    <span>🌙 Dark Mode</span>    
    <label class="switch">    
      <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">    
      <span class="slider"></span>    
    </label>    
  </div>      <ul class="menu-list">    
    <li>👤 Profile Yako</li>    
    <li>📊 Insights</li>    
    <li>⚙️ Settings</li>    
    <li>🔔 Notifications</li>    
    <li>💬 Messages</li>    
    <li>🚪 Log Out</li>    
  </ul>    
</div>    </div>    <!-- CREATE POST MODAL -->    <div class="modal" id="createModal">    
    <div class="modal-content">    
      <div class="modal-header">    
        <h2>Post Mpya</h2>    
        <button class="close-btn" onclick="closeModal('createModal')">✕</button>    
      </div>  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">    
    <div class="post-avatar">W</div>    
    <div>    
      <strong>Wewe <span class="blue-tick">✓</span></strong>    
      <div style="font-size:12px;color:var(--text-secondary);">Public</div>    
    </div>    
  </div>      <textarea id="postText" placeholder="Andika kitu..."></textarea>      <div class="media-preview" id="mediaPreview"></div>      <input type="file" id="mediaInput" accept="image/*,video/*" hidden onchange="previewMedia(event)">      <div class="create-actions-row">    
    <button onclick="document.getElementById('mediaInput').click()">🖼️ Picha / Video</button>    
  </div>    <button class="submit-post" onclick="submitPost()">Chapisha</button>

</div>    </div>    <script>    
    // ========== DATA ==========    
    const currentUser = {    
      id: "me",    
      name: "Wewe",    
      username: "wussa",    
      avatar: "W",    
      verified: true,    
      followers: 125000    
    };    const users = [    
  currentUser,    
  { id: "u1", name: "Amina", username: "amina", avatar: "A", verified: true, followers: 45200 },    
  { id: "u2", name: "John", username: "johnd", avatar: "J", verified: false, followers: 3200 },    
  { id: "u3", name: "Star", username: "tikstar", avatar: "T", verified: true, followers: 890000 },    
  { id: "u4", name: "Creator", username: "local", avatar: "L", verified: false, followers: 8500 },    
  { id: "u5", name: "NewsTZ", username: "newstz", avatar: "N", verified: true, followers: 210000 }    
];    

let posts = JSON.parse(localStorage.getItem("wussabook_posts_v2")) || [    
  {    
    id: 1,    
    userId: "me",    
    text: "Karibu kwenye Wussabook toleo jipya! 🔥 Rangi mpya kama Instagram + Blue Tick",    
    media: null,    
    type: "text",    
    likes: 156,    
    comments: 28,    
    time: "2h",    
    liked: false    
  },    
  {    
    id: 2,    
    userId: "u1",    
    text: "Sunset vibes leo 🌅",    
    media: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800",    
    type: "image",    
    likes: 1240,    
    comments: 89,    
    time: "5h",    
    liked: false    
  },    
  {    
    id: 3,    
    userId: "u3",    
    text: "New reel dropping soon 💃 Who is ready?",    
    media: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=800",    
    type: "image",    
    likes: 8900,    
    comments: 412,    
    time: "1d",    
    liked: true    
  },    
  {    
    id: 4,    
    userId: "u5",    
    text: "Teknolojia inaendelea kubadilisha Tanzania 🇹🇿 #Innovation",    
    media: null,    
    type: "text",    
    likes: 3400,    
    comments: 210,    
    time: "3h",    
    liked: false    
  }    
];    

const stories = [    
  { id: "me", name: "Your Story", avatar: "W", verified: true, seen: false },    
  { id: "u1", name: "Amina", avatar: "A", verified: true, seen: false },    
  { id: "u3", name: "Star", avatar: "T", verified: true, seen: true },    
  { id: "u5", name: "NewsTZ", avatar: "N", verified: true, seen: false },    
  { id: "u2", name: "John", avatar: "J", verified: false, seen: true },    
  { id: "u4", name: "Creator", avatar: "L", verified: false, seen: false }    
];    

// ========== HELPERS ==========    
function getUser(id) {    
  return users.find(u => u.id === id) || currentUser;    
}    

function hasBlueTick(user) {    
  return user.verified || user.followers >= 10000;    
}    

function renderTick(user) {    
  return hasBlueTick(user) ? `<span class="blue-tick">✓</span>` : "";    
}    

// ========== RENDER ==========    
function renderStories() {    
  const el = document.getElementById("stories");    
  el.innerHTML = stories.map(s => `    
    <div class="story">    
      <div class="story-ring ${s.seen ? 'seen' : ''}">    
        <div class="story-avatar">${s.avatar}</div>    
      </div>    
      <div class="story-name">${s.name}</div>    
    </div>    
  `).join("");    
}    

function renderFeed() {    
  const feed = document.getElementById("feed");    
  if (posts.length === 0) {    
    feed.innerHTML = `<div class="empty">Hakuna posts bado.<br>Tengeneza ya kwanza!</div>`;    
    return;    
  }    

  feed.innerHTML = posts.map(post => {    
    const user = getUser(post.userId);    
    const media = post.media    
      ? (post.type === "video"    
          ? `<video class="post-media" controls src="${post.media}"></video>`    
          : `<img class="post-media" src="${post.media}" alt="media" loading="lazy" />`)    
      : "";    

    return `    
      <article class="post">    
        <div class="post-header">    
          <div class="post-avatar">${user.avatar}</div>    
          <div class="post-user">    
            <div class="name">${user.name} ${renderTick(user)}</div>    
            <div class="time">${post.time}</div>    
          </div>    
          <button class="more-btn">⋯</button>    
        </div>    

        ${media}    

        <div class="post-actions">    
         <button class="${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">    
            ${post.liked ? "❤️" : "🤍"}    
          </button>    
          <button>💬</button>    
          <button>➤</button>    
          <button style="margin-left:auto">🔖</button>    
        </div>    

        <div class="post-likes">${post.likes.toLocaleString()} likes</div>    

        <div class="post-caption">    
         <span class="username">${user.username}</span> ${post.text}
        </div>    

        ${post.comments > 0 ? `<div class="post-comments">View all ${post.comments} comments</div>` : ""}    
      </article>    
    `;    
  }).join("");    
}    

// ========== ACTIONS ==========    
function toggleLike(id) {    
  const post = posts.find(p => p.id === id);    
  if (!post) return;    
  post.liked = !post.liked;    
  post.likes += post.liked ? 1 : -1;    
  savePosts();    
  renderFeed();    
}    

function savePosts() {    
  localStorage.setItem("wussabook_posts_v2", JSON.stringify(posts));    
}    

function setActive(btn) {    
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));    
  btn.classList.add("active");    
}    

function openAccountMenu() {    
  document.getElementById("accountModal").classList.add("show");    
}    

function openCreatePost() {    
  document.getElementById("createModal").classList.add("show");    
  document.getElementById("postText").focus();    
}    

function closeModal(id) {    
  document.getElementById(id).classList.remove("show");    
  if (id === "createModal") {    
    document.getElementById("postText").value = "";    
    document.getElementById("mediaPreview").style.display = "none";    
    document.getElementById("mediaPreview").innerHTML = "";    
    document.getElementById("mediaInput").value = "";    
    selectedMedia = null;    
    selectedType = "text";    
  }    
}    

let selectedMedia = null;    
let selectedType = "text";    

function previewMedia(e) {    
  const file = e.target.files[0];    
  if (!file) return;    

  const url = URL.createObjectURL(file);    
  selectedMedia = url;    
  selectedType = file.type.startsWith("video/") ? "video" : "image";    

  const preview = document.getElementById("mediaPreview");    
  preview.style.display = "block";    
  preview.innerHTML = selectedType === "video"    
    ? `<video src="${url}" controls></video>`    
    : `<img src="${url}" alt="preview" />`;    
}    

function submitPost() {    
  const text = document.getElementById("postText").value.trim();    
  if (!text && !selectedMedia) {    
    alert("Andika kitu au ongeza picha/video");    
    return;    
  }    

  posts.unshift({    
    id: Date.now(),    
    userId: "me",    
    text: text || "",    
    media: selectedMedia,    
    type: selectedType,    
    likes: 0,    
    comments: 0,    
    time: "Just now",    
    liked: false    
  });    

  savePosts();    
  renderFeed();    
  closeModal("createModal");    
}    

// Theme    
function toggleTheme() {    
  const isDark = document.getElementById("themeSwitch").checked;    
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");    
  localStorage.setItem("wussabook_theme", isDark ? "dark" : "light");    
}    

// Close modal on outside click    
document.querySelectorAll(".modal").forEach(modal => {    
  modal.addEventListener("click", e => {    
    if (e.target === modal) closeModal(modal.id);    
  });    
});    

// ========== INIT ==========    
function init() {    
  const savedTheme = localStorage.getItem("wussabook_theme");    
  if (savedTheme === "dark") {    
    document.documentElement.setAttribute("data-theme", "dark");    
    document.getElementById("themeSwitch").checked = true;    
  }    
  renderStories();    
  renderFeed();    
}    

init();

</script>  </body>
